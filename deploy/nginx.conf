# Zona de cache de 50MB para metadados e ate 2GB em disco para respostas JSON do TSE
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=tse_cache:50m max_size=2g inactive=60m use_temp_path=off;

# Limitacao de taxa contra abusos e raspagem automatizada (30 req/s por IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 8080;
    server_name _;

    # Desativar exibicao da versao do servidor HTTP
    server_tokens off;

    # Cabecalhos defensivos de seguranca HTTP (WCAG e DevSecOps)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compressao de transferencia veloz para dispositivos moveis
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Roteamento do Micro-Proxy de Cache para Midias e Arquivos (/arquivo/)
    location /quemvotar/api/arquivo/ {
        # Limitacao de taxa com burst e rejeicao 429
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        rewrite ^/quemvotar/api/arquivo/(.*)$ /divulga/rest/arquivo/$1 break;

        proxy_pass http://quemvotar-api:3000;
        proxy_http_version 1.1;

        # Politica de Cache: 60 minutos para arquivos estaticos (fotos e documentos)
        proxy_cache tse_cache;
        proxy_cache_valid 200 60m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;

        # Headers de CORS liberados
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_connect_timeout 8s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # 2. Roteamento do Micro-Proxy de Cache para a API de Dados do TSE (/v1/)
    location /quemvotar/api/ {
        # Limitacao de taxa com burst e rejeicao 429
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        # Se contem v1/, preserva; senao, adiciona v1/ compulsoriamente
        rewrite ^/quemvotar/api/v1/(.*)$ /divulga/rest/v1/$1 break;
        rewrite ^/quemvotar/api/(.*)$ /divulga/rest/v1/$1 break;

        proxy_pass http://quemvotar-api:3000;
        proxy_http_version 1.1;

        # Politica de Cache: 15 minutos para respostas com sucesso (HTTP 200)
        proxy_cache tse_cache;
        proxy_cache_valid 200 15m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;

        # Headers de CORS liberados
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Timeouts estritos para evitar sockets pendentes
        proxy_connect_timeout 8s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # 2. Servico de Arquivos Estaticos do Flutter Web (SPA)
    location /quemvotar/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /quemvotar/index.html;

        # Desabilitar cache para HTML, JSON e scripts JS raiz para garantir atualizacoes instantaneas
        location ~* \.(json|html|js)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Cache imutavel de longo prazo para binarios versionados (WASM, fontes, imagens, css)
        location ~* \.(css|wasm|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
        }
    }

    # Redirecionamento de conveniencia
    location = /quemvotar {
        return 301 /quemvotar/;
    }
}
