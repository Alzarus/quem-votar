services:
  quemvotar-api:
    image: node:22-alpine
    container_name: quemvotar-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./proxy.mjs:/app/proxy.mjs:ro
    command: ["node", "proxy.mjs"]
    networks:
      - proxy_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  quemvotar-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quemvotar-web
    restart: unless-stopped
    depends_on:
      - quemvotar-api
    ports:
      # Exposto no loopback para validacao interna e auditoria de cache
      - "127.0.0.1:5340:8080"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - cache_data:/var/cache/nginx
    networks:
      - proxy_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cache_data:

networks:
  proxy_default:
    external: true
